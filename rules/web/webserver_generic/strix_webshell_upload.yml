title: Strix Webshell Upload Attempt
id: 7f4dd7d4-5b7c-4ae0-8d50-8d1d3a7f3004
status: experimental
description: Detects POST requests containing webshell file extensions or upload execution parameters.
author: Strix Project
date: 2026-10-13
modified: 2026-10-13
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection_method:
        cs-method: 'POST'
    keywords:
        - '.php'
        - '.phtml'
        - '.jsp'
        - '.jspx'
        - '.aspx'
        - 'eval='
        - 'base64_decode'
        - 'cmd.exe'
    condition: selection_method and keywords
falsepositives:
    - Legitimate application uploads of server-side source files
level: high
